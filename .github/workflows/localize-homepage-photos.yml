name: Localize homepage photography
on:
  push:
    branches: [main]
    paths:
      - 'scripts/localize_photos.py'
      - '.github/workflows/localize-homepage-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/localize_photos.py
      - name: Commit locally hosted photos and attribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.webp assets/PHOTO_CREDITS.json styles.css
          if ! git diff --cached --quiet; then
            git commit -m "Host oil and gas photography locally with license credits"
            git push
          fi
